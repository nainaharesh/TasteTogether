name: tastetogether
description: "A new Flutter project."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# Read more about Android versioning at
# https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below
# to the latest versions available on pub.dev.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  # App launcher icons.
  flutter_launcher_icons: ^0.14.4

  # Responsive UI.
  flutter_screenutil: ^5.9.3

  # GetX state management and navigation.
  get: ^4.7.3

  # Local storage.
  get_storage: ^2.1.1

  # Google Fonts.
  google_fonts: ^8.2.1

  # Lottie animations.
  lottie: ^3.8.2

  # HTTP client for backend API integration.
  http: ^1.6.0

  # Secure storage for authentication tokens.
  flutter_secure_storage: ^11.2.0

  # Image picker for camera and gallery.
  image_picker: ^1.2.4

dev_dependencies:
  # The "flutter_test" package contains the Flutter testing framework.
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package contains a set of recommended lints to
  # encourage good coding practices. The lint set is activated in the
  # analysis_options.yaml file located in the root of your package.
  flutter_lints: ^6.0.0

# For information regarding the generic Dart part of this file, see
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants".
  # See https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here.
  # Each entry should have a "family" key and a "fonts" key with a list.
  #
  # Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies, see
  # https://flutter.dev/to/font-from-package

# App icon (design ka logo). Chalane ka tareeqa:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/app_icon.png
  adaptive_icon_background: "#B65C45"
  adaptive_icon_foreground: assets/app_icon/app_icon_foreground.png
  remove_alpha_ios: true
